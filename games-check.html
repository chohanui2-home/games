<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>verify</title>
<style>
  html,body{margin:0;padding:0;background:#ffffff;font:12px/1.4 -apple-system,sans-serif}
  .box{margin:0;padding:0}
  .lbl{padding:4px 6px;color:#333;background:#eee;font-weight:700}
  iframe{display:block;border:0;background:#fff}
  #f390{width:390px;height:844px}
  #f360{width:360px;height:740px}
  #f768{width:768px;height:1024px}
</style>
</head>
<body>
<div class="box"><div class="lbl">390x844</div><iframe id="f390" src="./" title="390"></iframe></div>
<div class="box"><div class="lbl">360x740</div><iframe id="f360" src="./" title="360"></iframe></div>
<div class="box"><div class="lbl">768x1024</div><iframe id="f768" src="./" title="768"></iframe></div>
<script>
window.__diag = {errors: []};
window.addEventListener('load', function(){
  ['f390','f360','f768'].forEach(function(id){
    var f = document.getElementById(id);
    try {
      f.contentWindow.addEventListener('error', function(e){
        window.__diag.errors.push(id + ': ' + (e.message || 'error'));
      });
      f.contentWindow.addEventListener('unhandledrejection', function(){
        window.__diag.errors.push(id + ': rejection');
      });
    } catch (err) {}
  });
});
</script>
</body>
</html>
